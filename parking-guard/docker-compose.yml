version: "3.9"

services:
  backend:
    build: ./backend
    container_name: i-defender-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./ai-models:/app/ai-models
      - ./backend/i_defender.db:/app/i_defender.db
    env_file: ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: i-defender-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: i-defender-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  uploads:
  ai_models:
